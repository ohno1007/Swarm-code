[package]
name = "swarm-desktop"
version = "0.1.0"
edition = "2021"
description = "Swarm-code desktop (local server + browser UI)"

# Standalone workspace so it builds independently of the core crates.
[workspace]

[[bin]]
name = "swarm-desktop"
path = "src/main.rs"

[dependencies]
swarm-core = { path = "../../crates/swarm-core" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
futures = "0.3"
rust-embed = "8"
mime_guess = "2"
open = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
