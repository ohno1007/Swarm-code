[package]
name = "swarm-gui"
version = "0.1.0"
edition = "2021"
description = "Swarm-code desktop GUI"

# Standalone workspace: keep the GUI isolated from the core crates' workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
swarm-core = { path = "../../crates/swarm-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
