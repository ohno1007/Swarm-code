[workspace]
resolver = "2"
members = [
    "crates/swarm-cli",
    "crates/swarm-core",
    "crates/swarm-llm",
    "crates/swarm-analyzer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ohno1007/swarm-code"
authors = ["Swarm-code contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
futures = "0.3"

# Internal crates
swarm-core = { path = "crates/swarm-core" }
swarm-llm = { path = "crates/swarm-llm" }
swarm-analyzer = { path = "crates/swarm-analyzer" }

[profile.release]
lto = "thin"
codegen-units = 1
